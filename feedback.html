<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
    <link rel="stylesheet" href="feedback.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ruda:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Ruda:wght@400&display=swap" rel="stylesheet">
</head>
<body>
    <header class="sticky-header">
        <div>
            <img src="immagini/pngwing.com.png" alt="logo-name" width="80px">
        </div>
        <nav>
            <div class="hamburger" id="hamburger">
                <span>&#9776;</span>
            </div>
            <ul id="nav-list">
                <li><a href="home.html">HOME</a></li>
                <li><a href="date.html">DATE</a></li>
                <li><a href="biografia.html">BIO</a></li>
                <li><a href="disco.html">DISCO</a></li>
                <li><a href="contatti.html">CONTATTI</a></li>
                <li><a href="#"><span>FEEDBACK</span></a></li>
            </ul>
        </nav>
    </header>
    <div class="feedback-container">
        <h2>Lascia un Feedback</h2>
        <form id="feedback-form">
            <label for="name">Nome:</label>
            <input type="text" id="name" required>

            <label for="message">Messaggio:</label>
            <textarea id="message" rows="4" required></textarea>

        <div class="rating">
            <input type="radio" name="star" id="star1" value="1"><label for="star1" class="fa fa-star"></label>
            <input type="radio" name="star" id="star2" value="2"><label for="star2" class="fa fa-star"></label>
            <input type="radio" name="star" id="star3" value="3"><label for="star3" class="fa fa-star"></label>
            <input type="radio" name="star" id="star4" value="4"><label for="star4" class="fa fa-star"></label>
            <input type="radio" name="star" id="star5" value="5"><label for="star5" class="fa fa-star"></label>
        </div>
            <button type="submit">Invia Feedback</button>
        </form>

        <div id="success" class="hidden">
            <p>Grazie per il tuo feedback!</p>
        </div>

        <div id="error" class="hidden">
            <p>Si è verificato un errore, per favore riprova.</p>
        </div>

        <div id="all-feedbacks">
            <h3>Tutti i Feedback:</h3>
            <div id="feedback-list"></div>
        </div>
    </div>

    <footer>
        <div class="footer-container">
            <div class="left">
                <p> 
                    <p><i class="fas fa-map-marked-alt"></i><a href="https://g.co/kgs/MGqRW8r"> 205, Gangdong daero, Gangdong-gu, Seoul.</a></p>
                </p>
            </div>
            <div class="right">
                <p>
                    <a href="https://straykids.jype.com/"><i class="fas fa-globe"></i> https://straykids.jype.com/</a>
                </p>
            </div>
        </div>
    </footer>
</body>
<script>
    document.addEventListener('DOMContentLoaded', function () {
    // funzione per aggiornare la lista dei feedback visualizzati
    function aggiornaFeedback() {
        const feedbackSalvati = localStorage.getItem('feedbacks');
        const feedbackListContainer = document.getElementById('feedback-list');
        feedbackListContainer.innerHTML = ''; // pulisce il contenuto esistente
        
        if (feedbackSalvati) {
            const feedbacks = JSON.parse(feedbackSalvati);
    
            feedbacks.forEach(feedback => {
                const feedbackDiv = document.createElement('div');
                feedbackDiv.classList.add('inserimentoFeedback');
                let stars = '';
                for (let i = 1; i <= 5; i++) {
                    if (i <= feedback.rating) {
                        stars += '<i class="fa fa-star" style="color: rgb(194, 37, 37);"></i>'
                    } else {
                        stars += '<i class="fa fa-star" style="color: #ddd;"></i>'; 
                    }
            }
                feedbackDiv.innerHTML = `
                    <p><strong>Valutazione:</strong> ${stars}</p>
                    <p><strong>Nome:</strong> ${feedback.name}</p>
                    <p><strong>Messaggio:</strong> ${feedback.message}</p>`;
    
                feedbackListContainer.appendChild(feedbackDiv);
            });
        }
    }

    // aggiungi evento al form per l'invio del feedback
    document.getElementById("feedback-form").addEventListener("submit", function (event) {
        event.preventDefault();

        const name = document.getElementById("name").value;
        const message = document.getElementById("message").value;
        const rating = document.querySelector('input[name="star"]:checked')?.value;

        if (name === ""|| message === "" || !rating) {
            document.getElementById("error").classList.remove("hidden");
            document.getElementById("success").classList.add("hidden");
        } else {
            const feedback = {
                name: name,
                message: message,
                rating: rating
            };

            // recupera i feedback salvati nel localStorage (se esistono) e inizializza come array vuoto se non ci sono feedback
            let feedbacks = JSON.parse(localStorage.getItem('feedbacks')) || [];

            feedbacks.unshift(feedback);

            // memorizza l'array aggiornato nel localStorage
            localStorage.setItem('feedbacks', JSON.stringify(feedbacks));

            document.getElementById("success").classList.remove("hidden");
            document.getElementById("error").classList.add("hidden");
            document.getElementById("feedback-form").reset();
            aggiornaFeedback();
        }
    });

    // funzione per caricare e visualizzare i feedback già presenti nel localStorage all'avvio della pagina
    window.onload = function () {
        aggiornaFeedback();
    };
});

const hamburger = document.getElementById('hamburger');
        const navList = document.getElementById('nav-list');

        hamburger.addEventListener('click', () => {
            navList.classList.toggle('show');
        });
    
</script>
</html>
